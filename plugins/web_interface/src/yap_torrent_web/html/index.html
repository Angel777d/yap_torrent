<!DOCTYPE html>
<html lang="en">
<head>
    <title>YAP Torrent</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!-- Top Controls -->
<div class="top-controls">
    <h1>YAP Torrent</h1>
    <div class="control-buttons">
        <button onclick="loadTorrents()">Refresh</button>
        <div class="magnet-form">
            <label for="magnet-input"></label><input type="text" id="magnet-input"
                                                     placeholder="magnet:?xt=urn:btih:..."/>
            <button class="btn-add" onclick="addMagnetLink()">Add Magnet</button>
        </div>
    </div>
</div>

<!-- Main Split View -->
<div class="main-container">
    <!-- Left: Torrent List -->
    <div class="torrents-panel">
        <div id="torrents-list">Loading...</div>
    </div>

    <!-- Right: Torrent Info -->
    <div class="torrent-info-panel">
        <div id="torrent-info">
            <p class="no-selection">Select a torrent to view details</p>
        </div>

        <!-- Controls at the bottom of torrent info -->
        <div id="torrent-controls" class="torrent-controls" style="display: none;">
            <h3>Actions</h3>
            <div class="control-buttons-split">
                <div class="control-buttons-left">
                    <button data-action="start" onclick="torrentActionSelected('start')">Start</button>
                    <button data-action="stop" onclick="torrentActionSelected('stop')">Stop</button>
                    <button onclick="torrentActionSelected('invalidate')">Invalidate</button>
                    <button onclick="torrentActionSelected('dht_ask_peers')">DHT Ask Peers</button>
                </div>
                <div class="control-buttons-right">
                    <button class="btn-remove" onclick="torrentActionSelected('remove')">Remove</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
