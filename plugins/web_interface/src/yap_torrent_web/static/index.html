<!DOCTYPE html>
<html>
<head>
    <title>YAP Torrent</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!-- Top Controls -->
<div class="top-controls">
    <h1>YAP Torrent</h1>
    <div class="control-buttons">
        <button onclick="showStatusPopup()">Status</button>
        <button onclick="loadTorrents()">Refresh</button>
        <div class="magnet-form">
            <label for="magnet-input"></label><input type="text" id="magnet-input" placeholder="magnet:?xt=urn:btih:..."/>
            <button class="btn-add" onclick="addMagnetLink()">Add Magnet</button>
        </div>
    </div>
</div>

<!-- Status Popup -->
<div id="status-popup" class="popup-overlay" onclick="hideStatusPopup()">
    <div class="popup-content" onclick="event.stopPropagation()">
        <h2>Status</h2>
        <div class="status-item">
            <strong>Status:</strong> <span id="status-running">-</span>
        </div>
        <div class="status-item">
            <strong>Peer ID:</strong> <span id="status-peer-id">-</span>
        </div>
        <div class="status-item">
            <strong>IP:</strong> <span id="status-ip">-</span>
        </div>
        <div class="status-item">
            <strong>External IP:</strong> <span id="status-external-ip">-</span>
        </div>
        <button onclick="hideStatusPopup()">Close</button>
    </div>
</div>

<!-- Main Split View -->
<div class="main-container">
    <!-- Left: Torrent List -->
    <div class="torrents-panel">
        <h2>Torrents</h2>
        <div id="torrents-list">Loading...</div>
    </div>

    <!-- Right: Torrent Info -->
    <div class="torrent-info-panel">
        <div id="torrent-info">
            <p class="no-selection">Select a torrent to view details</p>
        </div>

        <!-- Controls at bottom of torrent info -->
        <div id="torrent-controls" class="torrent-controls" style="display: none;">
            <h3>Actions</h3>
            <div class="control-buttons-split">
                <div class="control-buttons-left">
                    <button onclick="torrentActionSelected('start')">Start</button>
                    <button onclick="torrentActionSelected('stop')">Stop</button>
                    <button onclick="torrentActionSelected('invalidate')">Invalidate</button>
                    <button onclick="torrentActionSelected('dht_ask_peers')">DHT Ask Peers</button>
                </div>
                <div class="control-buttons-right">
                    <button class="btn-remove" onclick="torrentActionSelected('remove')">Remove</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
