<!DOCTYPE html>
<html>
<head>
	<title>YAP Torrent Web Interface</title>
	<meta charset="utf-8">
	<link rel="stylesheet" href="/static/style.css">
</head>
<body>
	<div class="container">
		<h1>YAP Torrent Web Interface</h1>

		<div class="status">
			<h2>Status</h2>
			<button onclick="loadStatus()">Refresh Status</button>
			<div id="status">
				<div class="status-item">
					<strong>Status:</strong> <span id="status-running">-</span>
				</div>
				<div class="status-item">
					<strong>Peer ID:</strong> <span id="status-peer-id">-</span>
				</div>
				<div class="status-item">
					<strong>IP:</strong> <span id="status-ip">-</span>
				</div>
				<div class="status-item">
					<strong>External IP:</strong> <span id="status-external-ip">-</span>
				</div>
			</div>
		</div>

		<div class="torrents">
			<h2>Torrents</h2>
			<div class="torrent-controls">
				<button onclick="loadTorrents()">Refresh</button>
				<button class="btn-start" onclick="torrentActionSelected('start')">Start</button>
				<button class="btn-stop" onclick="torrentActionSelected('stop')">Stop</button>
				<button class="btn-invalidate" onclick="torrentActionSelected('invalidate')">Invalidate</button>
				<button class="btn-remove" onclick="torrentActionSelected('remove')">Remove</button>
				<button class="btn-dht" onclick="torrentActionSelected('dht_ask_peers')">DHT Ask Peers</button>
			</div>
			<div id="torrents-list">Click refresh to load torrents...</div>
		</div>
	</div>

	<script src="/static/app.js"></script>
</body>
</html>
