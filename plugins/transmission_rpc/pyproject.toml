[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/*",
]

# named explicitly so the bundled web UI (html/) ships in the wheel alongside the modules
[tool.hatch.build.targets.wheel]
packages = ["src/yap_torrent_transmission_rpc"]

[project.entry-points.'yap_torrent.plugins']
yap_torrent_transmission_rpc = 'yap_torrent_transmission_rpc'

[project]
name = "yap_torrent_transmission_rpc"
version = "0.2.0"
description = "Transmission RPC server API and web interface for yap torrent"
readme = { file = "README.md", content-type = "text/markdown" }

authors = [
    { name = "Angelovich", email = "angel777da@gmail.com" },
]
maintainers = []

requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "yap_torrent>=0.2.2",
    "aiohttp",
    "angelovich.core>=0.2.0",
]

license = "MIT"
license-files = ["LICEN[CS]E*"]

keywords = ["Torrent", "BitTorrent", "Transmission", "RPC", "Web Interface"]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-aiohttp",
]

[project.urls]
Homepage = "https://github.com/Angel777d/yap_torrent/tree/master/plugins/transmission_rpc"
Issues = "https://github.com/Angel777d/yap_torrent/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
