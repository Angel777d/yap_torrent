name: Publish YAP-Torrent Transmission RPC plugin to PyPI

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  check:
    name: Check whether the version is unpublished
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compare pyproject version against PyPI
        id: version
        env:
          PACKAGE: yap_torrent_transmission_rpc
          PROJECT_DIR: plugins/transmission_rpc
        run: |
          version="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "$PROJECT_DIR/pyproject.toml")"
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$PACKAGE/$version/json")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$status" in
            404) echo "publish=true" >> "$GITHUB_OUTPUT"; echo "$PACKAGE $version is not on PyPI - publishing" ;;
            200) echo "publish=false" >> "$GITHUB_OUTPUT"; echo "$PACKAGE $version is already on PyPI - nothing to do" ;;
            *) echo "PyPI answered $status for $PACKAGE $version"; exit 1 ;;
          esac

  release-build:
    name: Build distributions
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build release distributions
        working-directory: ./plugins/transmission_rpc
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: plugins/transmission_rpc/dist/

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs:
      - release-build

    permissions:
      id-token: write

    environment:
      name: pypi-transmission-rpc-plugin-release
      url: https://pypi.org/p/yap_torrent_transmission_rpc

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
